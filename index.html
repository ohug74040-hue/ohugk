<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c6b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>我的日历</title>
<style>
:root{--bg:#eef1f3;--card:#fff;--tx:#16222a;--sub:#7b8892;--ac:#0e7c6b;--on:#fff;--line:#e3e8eb;--red:#d9534f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1517;--card:#182025;--tx:#e6eeef;--sub:#869298;--ac:#4fd1b5;--on:#06201a;--line:#26323a;--red:#ff8077;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:6px;padding:16px 12px 8px 18px}
h1{flex:1;margin:0;font-size:30px;font-weight:700;line-height:1}
h1 small{margin-left:8px;font-size:14px;font-weight:500;color:var(--sub)}
header button{height:38px;min-width:38px;padding:0 10px;border:0;border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:20px}
header #today{font-size:14px;color:var(--ac)}
.wk,#grid{display:grid;grid-template-columns:repeat(7,1fr)}
.wk{padding:6px 8px 2px;text-align:center;font-size:13px;color:var(--sub)}
.wk .w,.d.w b{color:var(--red)}
#grid{gap:2px;padding:0 8px}
.d{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:54px;padding:0;border:0;border-radius:14px;background:none;color:var(--tx);font:inherit}
.d b{font-size:17px;font-weight:600}
.d i{font-size:10px;font-style:normal;color:var(--sub)}
.d u{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--ac)}
.d.o{opacity:.35}
.d.t{box-shadow:inset 0 0 0 1.5px var(--ac)}
.d.t b{color:var(--ac)}
.d.s{background:var(--ac)}
.d.s b,.d.s i{color:var(--on)}
.d.s u{background:var(--on)}
#p{flex:1;min-height:0;overflow:auto;margin-top:12px;padding:16px;border-radius:22px 22px 0 0;background:var(--card)}
#ph{margin:0 0 6px;font-size:15px;font-weight:600}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it span{min-width:44px;color:var(--ac);font-size:13px}
.it em{flex:1;font-style:normal;word-break:break-all}
.it button{padding:0 6px;border:0;background:none;color:var(--sub);font-size:22px}
.empty{padding:10px 0;color:var(--sub);font-size:14px}
#f{display:flex;gap:6px;margin-top:14px}
#f input{min-width:0;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
#t{width:108px}
#x{flex:1}
#f button{padding:0 16px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<header>
<h1 id="title"></h1>
<button id="prev" aria-label="上个月">‹</button>
<button id="next" aria-label="下个月">›</button>
<button id="today">今天</button>
</header>
<div class="wk" id="wk"></div>
<div id="grid"></div>
<section id="p">
<h2 id="ph"></h2>
<div id="items"></div>
<form id="f"><input id="t" type="time" aria-label="时间"><input id="x" placeholder="添加日程…" maxlength="60" autocomplete="off"><button>添加</button></form>
</section>
<script>
const $=s=>document.querySelector(s),KEY='cal-events-v1';
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let ev={};try{ev=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ev))}catch(e){}};
let sel=fmt(new Date()),view=new Date();view.setDate(1);

const LF=(()=>{try{return new Intl.DateTimeFormat('zh-u-ca-chinese',{month:'long',day:'numeric'})}catch(e){return null}})();
function lunar(d,full){
  try{
    const p=LF.formatToParts(d),g=t=>(p.find(x=>x.type===t)||{}).value||'';
    const m=g('month'),day=g('day').replace(/日$/,'');
    return full?m+day:(day==='初一'?m:day);
  }catch(e){return''}
}

$('#wk').innerHTML=['一','二','三','四','五','六','日'].map((w,i)=>`<span${i>4?' class="w"':''}>${w}</span>`).join('');

function render(){
  const y=view.getFullYear(),m=view.getMonth(),today=fmt(new Date());
  $('#title').innerHTML=`${m+1}月<small>${y}年</small>`;
  const off=(new Date(y,m,1).getDay()+6)%7;
  let h='';
  for(let i=0;i<42;i++){
    const d=new Date(y,m,1-off+i),k=fmt(d),n=(ev[k]||[]).length,c=['d'];
    if(d.getMonth()!==m)c.push('o');
    if(k===today)c.push('t');
    if(k===sel)c.push('s');
    if(d.getDay()%6===0)c.push('w');
    h+=`<button class="${c.join(' ')}" data-k="${k}"><b>${d.getDate()}</b><i>${lunar(d)}</i>${n?'<u></u>':''}</button>`;
  }
  $('#grid').innerHTML=h;
  const [sy,sm,sd]=sel.split('-').map(Number),D=new Date(sy,sm-1,sd),L=lunar(D,1);
  $('#ph').textContent=`${sm}月${sd}日 周${'日一二三四五六'[D.getDay()]}`+(L?` · 农历${L}`:'');
  const list=(ev[sel]||[]).slice().sort((a,b)=>(a.t||'').localeCompare(b.t||''));
  $('#items').innerHTML=list.length
    ?list.map(e=>`<div class="it"><span>${e.t||'全天'}</span><em>${esc(e.x)}</em><button data-id="${e.id}" aria-label="删除">×</button></div>`).join('')
    :'<div class="empty">这一天还没有日程</div>';
}

$('#grid').onclick=e=>{
  const b=e.target.closest('.d');if(!b)return;
  sel=b.dataset.k;
  const d=new Date(sel+'T00:00');
  if(d.getMonth()!==view.getMonth())view=new Date(d.getFullYear(),d.getMonth(),1);
  render();
};
$('#items').onclick=e=>{
  const id=e.target.dataset.id;if(!id)return;
  ev[sel]=(ev[sel]||[]).filter(v=>v.id!==id);
  if(!ev[sel].length)delete ev[sel];
  save();render();
};
$('#f').onsubmit=e=>{
  e.preventDefault();
  const x=$('#x').value.trim();if(!x)return;
  (ev[sel]=ev[sel]||[]).push({id:Date.now()+Math.random().toString(36).slice(2,6),t:$('#t').value,x});
  $('#x').value='';$('#t').value='';
  save();render();
};
$('#prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$('#next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$('#today').onclick=()=>{const n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);sel=fmt(n);render()};

let sx=null;
$('#grid').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('#grid').addEventListener('touchend',e=>{
  if(sx===null)return;
  const dx=e.changedTouches[0].clientX-sx;sx=null;
  if(Math.abs(dx)>60)$(dx<0?'#next':'#prev').click();
});

render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
